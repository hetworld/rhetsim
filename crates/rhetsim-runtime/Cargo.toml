[package]
name = "rhetsim-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rhetsim"
path = "src/main.rs"

[dependencies]
rhetsim-core     = { workspace = true }
rhetsim-manifest = { workspace = true }
rhetsim-compat   = { workspace = true }
tokio            = { workspace = true }
log              = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = "0.3"

[dev-dependencies]
rhetsim-cpu-mock   = { path = "../../components/cpu/rhetsim-cpu-mock" }
rhetsim-cpu-riscv  = { path = "../../components/cpu/rhetsim-cpu-riscv" }
rhetsim-mem-dram   = { path = "../../components/memory/rhetsim-mem-dram" }
rhetsim-io-uart    = { path = "../../components/io/rhetsim-io-uart" }
rhetsim-accel-gpgpu = { path = "../../components/accel/rhetsim-accel-gpgpu" }
rhetsim-intc-clint  = { path = "../../components/intc/rhetsim-intc-clint" }
rhetsim-intc-gicv3  = { path = "../../components/intc/rhetsim-intc-gicv3" }
rhetsim-cpu-arm     = { path = "../../components/cpu/rhetsim-cpu-arm" }
