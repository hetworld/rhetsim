[workspace]
resolver = "2"
members = [
    "crates/rhetsim-core",
    "crates/rhetsim-manifest",
    "crates/rhetsim-runtime",
    "crates/rhetsim-tcg",
    "crates/rhetsim-compat",
    "components/cpu/rhetsim-cpu-arm",
    "components/cpu/rhetsim-cpu-riscv",
    "components/cpu/rhetsim-cpu-x86",
    "components/cpu/rhetsim-cpu-mock",
    "components/intc/rhetsim-intc-gicv3",
    "components/intc/rhetsim-intc-plic",
    "components/intc/rhetsim-intc-clint",
    "components/cache/rhetsim-cache",
    "components/memory/rhetsim-mem-dram",
    "components/memory/rhetsim-mem-sram",
    "components/memory/rhetsim-mem-gddr",
    "components/io/rhetsim-io-uart",
    "components/io/rhetsim-io-pcie",
    "components/io/rhetsim-io-dma",
    "components/io/rhetsim-io-mailbox",
    "components/io/rhetsim-io-virtio",
    "components/accel/rhetsim-accel-gpgpu",
    "components/accel/rhetsim-accel-dpu",
    "tools/rhetsim-cli",
    "tools/rhetsim-dbg",
]

[workspace.dependencies]
rhetsim-core     = { path = "crates/rhetsim-core" }
rhetsim-manifest = { path = "crates/rhetsim-manifest" }
rhetsim-runtime  = { path = "crates/rhetsim-runtime" }
rhetsim-tcg      = { path = "crates/rhetsim-tcg" }
rhetsim-compat   = { path = "crates/rhetsim-compat" }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
thiserror        = "1"
bitflags         = "2"
log              = "0.4"
tracing          = "0.1"
tokio            = { version = "1", features = ["full"] }
kvm-ioctls       = "0.16"
vm-memory        = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
