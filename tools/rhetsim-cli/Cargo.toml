[package]
name = "rhetsim-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rhetsim-cli"
path = "src/main.rs"

[dependencies]
rhetsim-core     = { workspace = true }
rhetsim-manifest = { workspace = true }
rhetsim-runtime  = { workspace = true }
rhetsim-compat   = { workspace = true }
rhetsim-cpu-arm  = { path = "../../components/cpu/rhetsim-cpu-arm" }
rhetsim-cpu-riscv = { path = "../../components/cpu/rhetsim-cpu-riscv" }
rhetsim-cpu-x86  = { path = "../../components/cpu/rhetsim-cpu-x86" }
rhetsim-cpu-mock = { path = "../../components/cpu/rhetsim-cpu-mock" }
rhetsim-intc-gicv3 = { path = "../../components/intc/rhetsim-intc-gicv3" }
rhetsim-intc-plic  = { path = "../../components/intc/rhetsim-intc-plic" }
rhetsim-intc-clint = { path = "../../components/intc/rhetsim-intc-clint" }
rhetsim-cache      = { path = "../../components/cache/rhetsim-cache" }
rhetsim-mem-dram   = { path = "../../components/memory/rhetsim-mem-dram" }
rhetsim-mem-sram   = { path = "../../components/memory/rhetsim-mem-sram" }
rhetsim-mem-gddr   = { path = "../../components/memory/rhetsim-mem-gddr" }
rhetsim-io-uart    = { path = "../../components/io/rhetsim-io-uart" }
rhetsim-io-pcie    = { path = "../../components/io/rhetsim-io-pcie" }
rhetsim-io-dma     = { path = "../../components/io/rhetsim-io-dma" }
rhetsim-io-mailbox = { path = "../../components/io/rhetsim-io-mailbox" }
rhetsim-io-virtio  = { path = "../../components/io/rhetsim-io-virtio" }
rhetsim-accel-gpgpu = { path = "../../components/accel/rhetsim-accel-gpgpu" }
rhetsim-accel-dpu   = { path = "../../components/accel/rhetsim-accel-dpu" }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = "0.3"
goblin             = { workspace = true }
libc               = "0.2"
